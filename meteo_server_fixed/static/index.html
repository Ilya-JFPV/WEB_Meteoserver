<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meteo Map</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    html, body, #map { height: 100%; margin: 0; }
    .toolbar {
      position: absolute; z-index: 1000; top: 10px; left: 10px;
      background: #fff; padding: 6px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .toolbar button, .toolbar select {
      border: 1px solid #ddd; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer;
    }
    .toolbar button:hover { background: #f6f6f6; }
    .muted { color: #888; font-size: 12px; }
    .badge { font-size: 12px; padding: 4px 6px; border-radius: 8px; border:1px solid #d7d7d7; background:#f3f3f3; }
    .badge.ok { border-color:#cce5cc; background:#eaf6ea; color:#245b25; }
    .badge.err { border-color:#f1c0c0; background:#fde9e9; color:#a61b1b; }

    .status-strip { display:flex; gap:6px; align-items:center; }

    /* стили для попапа и графиков */
    .popup .head { margin-bottom: 6px; }
    .popup .controls { margin: 6px 0 8px; font-size: 14px; }
    .popup .controls .chk { margin-right: 10px; user-select: none; }
    .series-box { max-height: 260px; overflow-y: auto; padding: 6px 0; }
    .series-row { margin: 8px 0 14px; }
    .series-title { font: 600 13px system-ui, sans-serif; margin: 0 0 4px 2px; color:#333; }
    .series-canvas { width: 100%; height: 120px; display:block; border:1px solid #eee; border-radius:8px; background:#fff; }
    .series-hint, .series-error, .series-summary { color:#555; font: 13px system-ui, sans-serif; margin: 4px 2px 6px; }
    .series-error { color:#b00; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <button id="btnPlace">Place station</button>
    <button id="btnDemo">+ Demo</button>
    <label>Единицы:
      <select id="unitsSel">
        <option value="metric" selected>Metric</option>
      </select>
    </label>
    <label>Окно:
      <select id="windowSel">
        <option value="30">30 мин</option>
        <option value="360" selected>6 часов</option>
        <option value="1440">24 часа</option>
      </select>
    </label>
    <div class="status-strip">
      <span id="lastRefresh" class="badge">Обновление: —</span>
      <span id="fetchErrors" class="badge" style="display:none;">Ошибки: 0</span>
    </div>
    <span id="placeHint" class="muted" style="display:none;">кликни по карте, чтобы поставить станцию…</span>
  </div>

  <!-- наш клиентский код -->
  <script src="/static/client.js?v=208"></script>
</body>
</html>
